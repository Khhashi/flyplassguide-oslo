name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typesjekk, lint og tester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Typesjekk
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formattering
        run: pnpm format:check

      - name: Tester
        run: pnpm test

      - name: Bygg nettversjon
        run: pnpm build:web
